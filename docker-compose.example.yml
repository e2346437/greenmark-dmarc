# Copy to docker-compose.yml, fill in the values, then: docker compose up -d
services:
  dmarc:
    build: .
    container_name: greenmark-dmarc
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me
      IMAP_HOST: mail.example.net
      IMAP_PORT: "993"
      IMAP_USER: dmarc@example.net
      IMAP_PASSWORD: change-me
      IMAP_FOLDER: INBOX
      ARCHIVE_FOLDER: Archive
      POLL_MINUTES: "30"
      # Optional email. SMTP login defaults to the IMAP login.
      SMTP_HOST: mail.example.net
      SMTP_PORT: "587"
      ALERT_TO: support@example.com
      SUMMARY_TO: info@example.com
      TZ: America/New_York
